/* ---------- icon: real Lucide via UMD ---------- */
const ICON_MAP = {
  mapPin:'MapPin', calendar:'Calendar', users:'Users', msg:'MessageCircle',
  plus:'Plus', x:'X', arrowRight:'ArrowRight', check:'Check', search:'Search',
  clock:'Clock', money:'CircleDollarSign', car:'Car', shield:'Shield',
  sparkles:'Sparkles', trending:'TrendingUp', flame:'Flame', info:'Info',
  chev:'ChevronRight',
};
const kebabToCamel = (k) => k.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
const camelizeAttrs = (attrs = {}) => {
  const out = {};
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'width' || k === 'height') continue; // let className control size
    out[kebabToCamel(k)] = v;
  }
  return out;
};
const Icon = ({ name, className = "w-5 h-5", strokeWidth }) => {
  const lucideName = ICON_MAP[name] || name;
  const data = (typeof window !== 'undefined' && window.lucide && window.lucide.icons)
    ? window.lucide.icons[lucideName] : null;
  if (!data) {
    // graceful placeholder: empty SVG with correct sizing so layout doesn't shift
    return <svg viewBox="0 0 24 24" className={className} aria-hidden="true" />;
  }
  const [tag, rawAttrs, children = []] = data;
  const attrs = camelizeAttrs(rawAttrs);
  const finalProps = { ...attrs, className, 'aria-hidden': 'true' };
  if (strokeWidth != null) finalProps.strokeWidth = strokeWidth;
  return React.createElement(
    tag, finalProps,
    ...children.map(([childTag, childAttrs], i) =>
      React.createElement(childTag, { key: i, ...camelizeAttrs(childAttrs) })
    )
  );
};

const formatDate = (iso) => new Date(iso+'T00:00:00').toLocaleDateString('en-MY', { weekday:'short', day:'numeric', month:'short' });

  const [h,m] = t.split(':').map(Number);

  return `${((h+11)%12)+1}:${m.toString().padStart(2,'0')} ${period}`;
};

function SeatDots({ total, taken, animate=false }) {

    <div className="flex items-center gap-2">

        {Array.from({length: total}).map((_,i) => {
          const isLeft = i >= taken;

            <span key={i}
              className={"inline-block w-2.5 h-2.5 rounded-full transition-colors " +
                (isLeft
                  ? "bg-brand-500 ring-2 ring-brand-500/20 " + (animate ? "animate-pulse-soft" : "")
                  : "bg-ink/15")} />
          );
        })}
      </div>
      <span className={"text-xs font-semibold " + (left === 0 ? "text-ink/40" : left === 1 ? "text-accent-600" : "text-brand-700")}>
        {left === 0 ? "Full" : `${left} left`}
      </span>
    </div>
  );
}

function Modal({ open, onClose, children, title, subtitle }) {
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => e.key === 'Escape' && onClose();
    document.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
  }, [open, onClose]);
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/45 backdrop-blur-sm animate-fade-in" onClick={onClose}>
      <div className="bg-cream w-full sm:max-w-md sm:rounded-2xl rounded-t-3xl shadow-2xl border-t sm:border border-black/5 max-h-[92vh] overflow-y-auto animate-slide-up"
           onClick={e => e.stopPropagation()}>
        <div className="sticky top-0 bg-cream/95 backdrop-blur px-5 py-4 flex items-start justify-between gap-3 border-b border-black/5">
          <div>
            <div className="font-extrabold text-ink">{title}</div>
            {subtitle && <div className="text-xs text-ink-muted mt-0.5">{subtitle}</div>}
          </div>
          <button onClick={onClose} aria-label="Close" className="w-8 h-8 rounded-full hover:bg-black/5 flex items-center justify-center transition-colors cursor-pointer">
            <Icon name="x" className="w-5 h-5" />
          </button>
        </div>
        <div className="p-5">{children}</div>
      </div>
    </div>
  );
}

function App() {
  const [rides, setRides] = useState(SEED_RIDES);
  const [filter, setFilter] = useState({ from:'', to:'', date:'' });
  const [sortBy, setSortBy] = useState('recent');
  const [selectedId, setSelectedId] = useState(null);
  const [postOpen, setPostOpen] = useState(false);
  const [toast, setToast] = useState({ show:false, message:'' });

  const filtered = useMemo(() => {
    let r = rides.filter(r =>
      (!filter.from || r.from === filter.from) &&
      (!filter.to   || r.to   === filter.to)   &&
      (!filter.date || r.date === filter.date));
    if (sortBy === 'price') r = [...r].sort((a,b) => a.price - b.price);
    if (sortBy === 'date')  r = [...r].sort((a,b) => a.date.localeCompare(b.date));
    if (sortBy === 'recent')r = [...r].sort((a,b) => a.postedMin - b.postedMin);
    return r;
  }, [rides, filter, sortBy]);

  const hasActiveFilters = !!(filter.from || filter.to || filter.date);
  const selected = rides.find(r => r.id === selectedId) || null;

  const showToast = (message) => {
    setToast({ show:true, message });
    setTimeout(() => setToast({ show:false, message:'' }), 2600);
  };

  return (
    <div className="min-h-screen pb-24 sm:pb-12">
      <TopBar activeRides={rides.length} onPost={() => setPostOpen(true)} />
      <Hero activeRides={rides.length} />
      <PopularRoutes filter={filter} setFilter={setFilter} />
      <FilterBar
        filter={filter} setFilter={setFilter}
        onClear={() => setFilter({ from:'', to:'', date:'' })}
        hasActiveFilters={hasActiveFilters}
        sortBy={sortBy} setSortBy={setSortBy}
      />

      <main id="feed" className="max-w-6xl mx-auto px-4 sm:px-6 py-5">
        <div className="grid lg:grid-cols-[1fr,320px] gap-6">

                  <span className="tabular-nums">{filtered.length}</span> {filtered.length === 1 ? 'ride' : 'rides'}
                </div>
                {hasActiveFilters && (
                  <div className="text-xs text-ink-muted">
                    {[filter.from, filter.to, filter.date && formatDate(filter.date)].filter(Boolean).join(' · ')}
                  </div>
                )}
              </div>
              <div className="text-[11px] text-ink-muted hidden sm:block">Updated just now</div>
            </div>

            <div className="grid sm:grid-cols-2 gap-3">
              {filtered.length === 0
                ? <EmptyState onPost={() => setPostOpen(true)} onClear={() => setFilter({from:'',to:'',date:''})} />

        className="fixed bottom-5 right-5 z-30 inline-flex items-center gap-2 rounded-full bg-brand-600 hover:bg-brand-700 text-white font-semibold pl-4 pr-5 py-3 shadow-lg shadow-brand-600/30 hover:shadow-xl hover:scale-105 active:scale-95 transition-all cursor-pointer sm:hidden">
        <Icon name="plus" className="w-5 h-5" strokeWidth={3} /> Post a ride
      </button>

      <RideDetail ride={selected} onClose={() => setSelectedId(null)} />
      <PostRideForm open={postOpen} onClose={() => setPostOpen(false)}
        onSubmit={(newRide) => {
          setRides(prev => [newRide, ...prev]);
          showToast(`Posted! Your ride ${newRide.from.replace('Kota Kinabalu','KK')} → ${newRide.to.replace('Kota Kinabalu','KK')} is live.`);
        }} />
      <Toast show={toast.show} message={toast.message} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
