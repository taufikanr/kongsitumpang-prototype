const cities = ['Kota Kinabalu','Sandakan','Tawau','Keningau','Kudat','Kuching','Sibu','Miri','Bintulu','Lahad Datu'];

const formatDate = (iso) => {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-MY', { weekday:'short', day:'numeric', month:'short' });
};
const formatTime = (t) => {
  const [h,m] = t.split(':').map(Number);
  const period = h >= 12 ? 'PM' : 'AM';
  const hour12 = ((h + 11) % 12) + 1;
  return `${hour12}:${m.toString().padStart(2,'0')} ${period}`;
};

            className={"inline-block w-2.5 h-2.5 rounded-full border " +

        ))}
      </div>
      <span className="text-xs text-ink/60">{total - taken} left</span>
    </div>
  );
}

function Modal({ open, onClose, children, title }) {
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => e.key === 'Escape' && onClose();
    document.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
  }, [open, onClose]);
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/40 backdrop-blur-sm" onClick={onClose}>
      <div className="bg-cream w-full sm:max-w-md sm:rounded-2xl rounded-t-3xl shadow-2xl border-t sm:border border-black/5 max-h-[92vh] overflow-y-auto"
           onClick={e => e.stopPropagation()}>
        <div className="sticky top-0 bg-cream/95 backdrop-blur px-5 py-4 flex items-center justify-between border-b border-black/5">
          <div className="font-bold">{title}</div>
          <button onClick={onClose} className="w-8 h-8 rounded-full hover:bg-black/5 flex items-center justify-center">
            <Icon name="x" className="w-5 h-5" />
          </button>
        </div>
        <div className="p-5">{children}</div>
      </div>
    </div>
  );
}

    <Modal open={!!ride} onClose={onClose} title="Ride details">

        <div>
          <div className="flex items-center gap-2 text-xl font-extrabold">
            <span>{ride.from}</span>

            <span className="inline-flex items-center gap-1.5"><Icon name="clock" className="w-4 h-4 text-brand-600" />{formatTime(ride.time)}</span>
            <span className="inline-flex items-center gap-1.5"><Icon name="money" className="w-4 h-4 text-brand-600" />RM{ride.price}/seat</span>

        </div>

        <div className="rounded-xl bg-white border border-black/5 p-4">
          <div className="text-xs font-semibold uppercase tracking-wider text-ink/50 mb-2">Pickup point</div>
          <div className="text-sm flex gap-2"><Icon name="mapPin" className="w-4 h-4 text-brand-600 shrink-0 mt-0.5" />{ride.pickup}</div>
        </div>

        <div className="rounded-xl bg-white border border-black/5 p-4">

            <div className="text-xs font-semibold uppercase tracking-wider text-ink/50">Driver</div>
            {ride.verified && <VerifiedBadge uni={ride.uni} />}

          <Icon name="shield" className="w-4 h-4 shrink-0 mt-0.5" />
          <span>Tip: Always verify the driver's student ID before boarding. KongsiTumpang doesn't process payments — settle directly with the driver in cash.</span>

function PostRideForm({ open, onClose, onSubmit }) {
  const [f, setF] = useState({
    from:'Kota Kinabalu', to:'Sandakan', date:'', time:'',
    seatsTotal:3, price:30, pickup:'', driver:'', uni:'UMS', wa:'',
  });
  const set = (k,v) => setF(prev => ({ ...prev, [k]:v }));
  const handleSubmit = (e) => {
    e.preventDefault();
    if (!f.from || !f.to || !f.date || !f.time || !f.driver || !f.wa || !f.pickup) {
      alert('Please fill in all required fields.'); return;
    }
    if (f.from === f.to) { alert('From and To cannot be the same city.'); return; }
    onSubmit({
      ...f, id: Date.now(), seatsTaken:0,
      verified: f.uni === 'UMS',
      bio: 'New driver on KongsiTumpang.',
    });
    onClose();
  };
  return (
    <Modal open={open} onClose={onClose} title="Post a ride">
      <form onSubmit={handleSubmit} className="space-y-3">
        <div className="grid grid-cols-2 gap-2">
          <Field label="From*">
            <select value={f.from} onChange={e=>set('from',e.target.value)} className="input">
              {cities.map(c => <option key={c}>{c}</option>)}
            </select>
          </Field>
          <Field label="To*">
            <select value={f.to} onChange={e=>set('to',e.target.value)} className="input">
              {cities.map(c => <option key={c}>{c}</option>)}
            </select>
          </Field>
          <Field label="Date*"><input type="date" value={f.date} onChange={e=>set('date',e.target.value)} className="input" /></Field>
          <Field label="Time*"><input type="time" value={f.time} onChange={e=>set('time',e.target.value)} className="input" /></Field>
          <Field label="Seats available*">
            <input type="number" min="1" max="6" value={f.seatsTotal} onChange={e=>set('seatsTotal',+e.target.value)} className="input" />
          </Field>
          <Field label="Price per seat (RM)*">
            <input type="number" min="0" value={f.price} onChange={e=>set('price',+e.target.value)} className="input" />
          </Field>
        </div>
        <Field label="Pickup point*">
          <input value={f.pickup} onChange={e=>set('pickup',e.target.value)} className="input" placeholder="e.g. UMS Gate 1, 4:45pm" />
        </Field>
        <div className="grid grid-cols-2 gap-2">
          <Field label="Your name*">
            <input value={f.driver} onChange={e=>set('driver',e.target.value)} className="input" placeholder="Ahmad Faris" />
          </Field>
          <Field label="University*">
            <select value={f.uni} onChange={e=>set('uni',e.target.value)} className="input">
              {['UMS','UNIMAS','UiTM','UMSKAL','UMK','UM','USM','UTM','Other'].map(u => <option key={u}>{u}</option>)}
            </select>
          </Field>
        </div>
        <Field label="WhatsApp number*">
          <input value={f.wa} onChange={e=>set('wa',e.target.value)} className="input" placeholder="+60123456789" />
        </Field>
        <button type="submit"
          className="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3 mt-2 transition">
          <Icon name="sparkles" className="w-4 h-4" /> Post ride
        </button>
        <p className="text-[11px] text-ink/50 text-center">By posting, you agree to verify riders before pickup. KongsiTumpang isn't liable for off-platform arrangements.</p>
      </form>
    </Modal>
  );
}

}

function App() {
  const [rides, setRides] = useState(SEED_RIDES);
  const [filter, setFilter] = useState({ from:'', to:'', date:'' });
  const [selectedId, setSelectedId] = useState(null);
  const [postOpen, setPostOpen] = useState(false);

  const filtered = useMemo(() => rides.filter(r =>
    (!filter.from || r.from === filter.from) &&
    (!filter.to   || r.to   === filter.to)   &&
    (!filter.date || r.date === filter.date)
  ), [rides, filter]);

  const hasActiveFilters = !!(filter.from || filter.to || filter.date);
  const selected = rides.find(r => r.id === selectedId) || null;

  return (
    <div className="min-h-screen pb-28">
      {/* sticky brand header */}
      <header className="px-5 pt-5 flex items-center justify-between">
        <div className="flex items-center gap-2">
          <div className="w-8 h-8 rounded-xl bg-brand-600 text-white flex items-center justify-center font-extrabold">K</div>
          <div className="font-extrabold tracking-tight">KongsiTumpang</div>
        </div>
        <div className="text-[11px] text-ink/50">prototype · v1</div>
      </header>

      <Hero />
      <FilterBar
        filter={filter} setFilter={setFilter}
        onClear={() => setFilter({ from:'', to:'', date:'' })}
        hasActiveFilters={hasActiveFilters}
      />

      <main className="px-5 py-5 space-y-3 max-w-2xl mx-auto">
        <div className="flex items-center justify-between">
          <div className="text-sm font-semibold text-ink/70">
            {filtered.length} {filtered.length === 1 ? 'ride' : 'rides'} available
          </div>
          {hasActiveFilters && (
            <div className="text-xs text-ink/50">
              {[filter.from, filter.to, filter.date && formatDate(filter.date)].filter(Boolean).join(' · ')}
            </div>
          )}
        </div>
        {filtered.length === 0
          ? <EmptyState onPost={() => setPostOpen(true)} />
          : filtered.map(ride => <RideCard key={ride.id} ride={ride} onClick={() => setSelectedId(ride.id)} />)}
      </main>

      <HowItWorks />

      <footer className="px-5 py-8 text-center text-xs text-ink/40">
        Built by a UMS student · KD04503 Individual Task 2 · Not a real service yet
      </footer>

      {/* floating CTA */}
      <button onClick={() => setPostOpen(true)}
        className="fixed bottom-5 right-5 z-30 inline-flex items-center gap-2 rounded-full bg-brand-600 hover:bg-brand-700 text-white font-semibold pl-4 pr-5 py-3 shadow-lg shadow-brand-600/30 transition">
        <Icon name="plus" className="w-5 h-5" strokeWidth={2.5} /> Post a ride
      </button>

      <RideDetail ride={selected} onClose={() => setSelectedId(null)} />
      <PostRideForm open={postOpen} onClose={() => setPostOpen(false)}
        onSubmit={(newRide) => setRides(prev => [newRide, ...prev])} />

      {/* input styles via head <style> wouldn't apply to JSX class="input", so inline a CSS-in-JS tag */}
      <style>{`
        .input { width:100%; background:white; border:1px solid rgba(0,0,0,0.1); border-radius:0.75rem; padding:0.625rem 0.75rem; font-size:14px; outline:none; transition:border-color .15s; }
        .input:focus { border-color:#16A34A; box-shadow:0 0 0 3px rgba(22,163,74,0.12); }
      `}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
